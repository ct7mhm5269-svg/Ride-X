
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RideX</title>

<style>
* {
 box-sizing: border-box;
}

body {
 margin: 0;
 font-family: Arial, sans-serif;
 background: #f5f7f6;
 color: #222;
 text-align: center;
}

header {
 background: #00a86b;
 color: white;
 padding: 30px 15px;
 border-radius: 0 0 25px 25px;
}

h1 {
 font-size: 45px;
 margin: 0;
}

.container {
 padding: 22px;
 max-width: 550px;
 margin: auto;
}

.page {
 display: none;
}

.active {
 display: block;
}

.card {
 background: white;
 padding: 20px;
 margin: 15px 0;
 border-radius: 15px;
 box-shadow: 0 3px 12px #0001;
 text-align: right;
}

input, select {
 width: 100%;
 padding: 16px;
 margin: 10px 0;
 border: 1px solid #ddd;
 border-radius: 12px;
 font-size: 17px;
 background: white;
}

button {
 width: 100%;
 padding: 17px;
 margin: 10px 0;
 background: #00a86b;
 color: white;
 border: none;
 border-radius: 12px;
 font-size: 18px;
 cursor: pointer;
}

button:disabled {
 opacity: .5;
}

.dark {
 background: #222;
}

.red {
 background: #d64545;
}

.vehicle-grid {
 display: grid;
 grid-template-columns: repeat(2, 1fr);
 gap: 10px;
 margin: 15px 0;
}

.vehicle {
 background: white;
 border: 2px solid #ddd;
 border-radius: 12px;
 padding: 15px 5px;
 cursor: pointer;
}

.vehicle span {
 display: block;
 font-size: 29px;
 margin-bottom: 8px;
}

.vehicle.selected {
 border-color: #00a86b;
 background: #e5fff3;
}

.small {
 color: #777;
 font-size: 14px;
 line-height: 1.6;
}

.price {
 color: #00a86b;
 font-size: 25px;
 font-weight: bold;
}
</style>
</head>

<body>

<header>
<h1>RideX</h1>
<p>مشوارك بالسعر اللي يناسبك</p>
</header>

<!-- الرئيسية -->

<div id="home" class="page active container">

<h2>أهلاً بيك في RideX</h2>

<p>اختار طريقة استخدام التطبيق</p>

<button onclick="showPage('passenger')">
أنا عميل
</button>

<button class="dark" onclick="showDriver()">
أنا سواق
</button>

<p class="small">
نسخة تجريبية من تطبيق RideX
</p>

</div>

<!-- واجهة العميل -->

<div id="passenger" class="page container">

<h2>اطلب مشوارك</h2>

<div class="card">

<h3>اختار نوع المركبة</h3>

<div id="vehicleList" class="vehicle-grid"></div>

<h3>تفاصيل الرحلة</h3>

<input id="pickup"
placeholder="مكان الركوب">

<input id="destination"
placeholder="مكان الوصول">

<input id="price"
type="number"
min="1"
placeholder="السعر المقترح بالجنيه">

<button onclick="requestRide()">
اطلب الرحلة
</button>

</div>

<button class="dark" onclick="showPage('home')">
رجوع
</button>

</div>

<!-- شاشة انتظار العروض -->

<div id="waiting" class="page container">

<h2>طلب رحلتك</h2>

<div class="card">

<div id="rideInfo"></div>

<h3>عروض السواقين</h3>

<div id="offersList"></div>

</div>

<button class="dark" onclick="showPage('home')">
الصفحة الرئيسية
</button>

<button class="red" onclick="cancelRide()">
إلغاء الطلب
</button>

</div>

<!-- واجهة السواق -->

<div id="driver" class="page container">

<h2>واجهة السواق</h2>

<div class="card">

<h3>نوع مركبتك</h3>

<select id="driverVehicle"></select>

<button onclick="showDriver()">
عرض الطلبات المناسبة
</button>

</div>

<div id="driverRequests"></div>

<button class="dark" onclick="showPage('home')">
الرئيسية
</button>

</div>

<!-- شاشة الرحلة المقبولة -->

<div id="trip" class="page container">

<h2>تفاصيل الرحلة</h2>

<div class="card" id="tripDetails"></div>

<button onclick="finishRide()">
إنهاء الرحلة
</button>

<button class="dark" onclick="showPage('home')">
الرئيسية
</button>

</div>

<script>

// أنواع المركبات

const vehicles = [
 {id:"car",name:"ملاكي",icon:"🚗"},
 {id:"taxi",name:"تاكسي",icon:"🚕"},
 {id:"motorcycle",name:"موتوسيكل",icon:"🏍️"},
 {id:"scooter",name:"سكوتر",icon:"🛵"},
 {id:"tuktuk",name:"توك توك",icon:"🛺"},
 {id:"microbus",name:"ميكروباص",icon:"🚐"},
 {id:"van",name:"فان",icon:"🚐"},
 {id:"minibus",name:"ميني باص",icon:"🚌"},
 {id:"bus",name:"أتوبيس",icon:"🚌"},
 {id:"pickup",name:"نصف نقل",icon:"🛻"},
 {id:"truck",name:"نقل",icon:"🚚"},
 {id:"heavy",name:"نقل ثقيل",icon:"🚛"},
 {id:"cold",name:"نقل مبرد",icon:"🚛"},
 {id:"tow",name:"ونش إنقاذ",icon:"🚨"}
];

let selectedVehicle = null;

const STORAGE_KEY = "ridex_demo_v4";

function loadRide() {
 try {
  return JSON.parse(localStorage.getItem(STORAGE_KEY));
 } catch(e) {
  return null;
 }
}

let ride = loadRide();

function saveRide() {
 if (ride) {
  localStorage.setItem(STORAGE_KEY,JSON.stringify(ride));
 } else {
  localStorage.removeItem(STORAGE_KEY);
 }
}

function vehicleName(id) {
 const v = vehicles.find(x => x.id === id);
 return v ? v.icon + " " + v.name : "غير محدد";
}

// التنقل بين الصفحات

function showPage(id) {

 document.querySelectorAll(".page").forEach(p => {
  p.classList.remove("active");
 });

 document.getElementById(id).classList.add("active");

 window.scrollTo(0,0);
}

// عرض أنواع المركبات

function renderVehicles() {

 const list = document.getElementById("vehicleList");
 list.innerHTML = "";

 vehicles.forEach(v => {

  const item = document.createElement("div");

  item.className = "vehicle";
  item.dataset.id = v.id;

  item.innerHTML =
   "<span>" + v.icon + "</span>" + v.name;

  item.onclick = () => selectVehicle(v.id);

  list.appendChild(item);

 });

}

function selectVehicle(id) {

 selectedVehicle = id;

 document.querySelectorAll(".vehicle").forEach(v => {

  v.classList.toggle(
   "selected",
   v.dataset.id === id
  );

 });

}

// إنشاء طلب رحلة

function requestRide() {

 const pickup =
 document.getElementById("pickup").value.trim();

 const destination =
 document.getElementById("destination").value.trim();

 const priceText =
 document.getElementById("price").value.trim();

 const price = Number(priceText);

 if (!selectedVehicle) {
  alert("اختار نوع المركبة الأول");
  return;
 }

 if (!pickup || !destination) {
  alert("اكتب مكان الركوب والوصول");
  return;
 }

 if (!priceText || !Number.isFinite(price) || price <= 0) {
  alert("اكتب سعر صحيح");
  return;
 }

 if (ride && ride.status !== "finished" &&
     ride.status !== "cancelled") {
  alert("عندك رحلة حالية. انهيها أو الغيها الأول");
  return;
 }

 ride = {
  id: Date.now(),
  vehicle: selectedVehicle,
  pickup: pickup,
  destination: destination,
  price: price,
  offers: [],
  acceptedOffer: null,
  status: "waiting"
 };

 saveRide();

 renderWaiting();

 showPage("waiting");

}

// تفاصيل الطلب

function renderWaiting() {

 if (!ride) {
  showPage("home");
  return;
 }

 const info = document.getElementById("rideInfo");

 info.innerHTML = "";

 const title = document.createElement("h3");
 title.textContent = vehicleName(ride.vehicle);

 const from = document.createElement("p");
 from.textContent = "من: " + ride.pickup;

 const to = document.createElement("p");
 to.textContent = "إلى: " + ride.destination;

 const price = document.createElement("p");
 price.className = "price";
 price.textContent = ride.price + " جنيه";

 info.append(title,from,to,price);

 const list = document.getElementById("offersList");

 list.innerHTML = "";

 if (ride.status === "accepted") {
  renderTrip();
  showPage("trip");
  return;
 }

 if (!ride.offers.length) {
  list.textContent = "لسه مفيش عروض";
  return;
 }

 ride.offers.forEach(offer => {

  const card = document.createElement("div");
  card.className = "card";

  const name = document.createElement("h3");
  name.textContent = "عرض سواق";

  const amount = document.createElement("p");
  amount.className = "price";
  amount.textContent = offer.price + " جنيه";

  const accept = document.createElement("button");
  accept.textContent = "قبول العرض";
  accept.onclick = () => acceptOffer(offer.id);

  const reject = document.createElement("button");
  reject.className = "red";
  reject.textContent = "رفض العرض";
  reject.onclick = () => rejectOffer(offer.id);

  card.append(name,amount,accept,reject);
  list.appendChild(card);

 });

}

// واجهة السواق

function setupDriverVehicles() {

 const select = document.getElementById("driverVehicle");

 vehicles.forEach(v => {

  const option = document.createElement("option");

  option.value = v.id;
  option.textContent = v.icon + " " + v.name;

  select.appendChild(option);

 });

}

function showDriver() {

 showPage("driver");

 const type =
 document.getElementById("driverVehicle").value;

 const area =
 document.getElementById("driverRequests");

 area.innerHTML = "";

 if (!ride || ride.status !== "waiting") {

  area.innerHTML =
  '<div class="card">لا توجد طلبات متاحة حاليًا</div>';

  return;
 }

 if (ride.vehicle !== type) {

  area.innerHTML =
  '<div class="card">لا توجد طلبات مناسبة لنوع مركبتك</div>';

  return;
 }

 const card = document.createElement("div");
 card.className = "card";

 const heading = document.createElement("h3");
 heading.textContent = "طلب رحلة جديد";

 const details = document.createElement("p");
 details.textContent =
  vehicleName(ride.vehicle) +
  " | من: " + ride.pickup +
  " | إلى: " + ride.destination;

 const amount = document.createElement("p");
 amount.className = "price";
 amount.textContent = ride.price + " جنيه";

 const accept = document.createElement("button");
 accept.textContent = "قبول سعر العميل";
 accept.onclick = () => submitOffer(true);

 const input = document.createElement("input");
 input.id = "offerPrice";
 input.type = "number";
 input.min = "1";
 input.placeholder = "اكتب سعرك المقترح";

 const send = document.createElement("button");
 send.className = "dark";
 send.textContent = "إرسال عرض جديد";
 send.onclick = () => submitOffer(false);

 card.append(heading,details,amount,accept,input,send);

 area.appendChild(card);

}

// تقديم عرض

function submitOffer(samePrice) {

 if (!ride || ride.status !== "waiting") return;

 const type =
 document.getElementById("driverVehicle").value;

 if (type !== ride.vehicle) {
  alert("نوع المركبة غير مطابق لطلب العميل");
  return;
 }

 const input = document.getElementById("offerPrice");

 const price = samePrice
  ? ride.price
  : Number(input.value);

 if (!samePrice &&
     (!input.value.trim() ||
      !Number.isFinite(price) ||
      price <= 0)) {
  alert("اكتب سعر صحيح");
  return;
 }

 const offer = {
  id: Date.now(),
  price: price
 };

 ride.offers.push(offer);

 saveRide();

 alert("تم إرسال العرض بنجاح");

 showPage("home");

}

// قبول عرض

function acceptOffer(id) {

 if (!ride || ride.status !== "waiting") return;

 const offer = ride.offers.find(o => o.id === id);

 if (!offer) return;

 ride.acceptedOffer = offer;
 ride.status = "accepted";

 saveRide();

 renderTrip();

 showPage("trip");

}

// رفض عرض

function rejectOffer(id) {

 if (!ride || ride.status !== "waiting") return;

 ride.offers = ride.offers.filter(o => o.id !== id);

 saveRide();

 renderWaiting();

}

// تفاصيل الرحلة

function renderTrip() {

 if (!ride || !ride.acceptedOffer) return;

 const box = document.getElementById("tripDetails");

 box.innerHTML = "";

 const lines = [
  vehicleName(ride.vehicle),
  "من: " + ride.pickup,
  "إلى: " + ride.destination,
  "السعر المتفق عليه: " +
   ride.acceptedOffer.price + " جنيه",
  "حالة الرحلة: تم قبول العرض"
 ];

 lines.forEach(line => {
  const p = document.createElement("p");
  p.textContent = line;
  box.appendChild(p);
 });

}

// إنهاء الرحلة

function finishRide() {

 if (!ride || ride.status !== "accepted") return;

 ride.status = "finished";
 saveRide();

 alert("تم إنهاء الرحلة بنجاح");

 ride = null;
 saveRide();

 showPage("home");

}

// إلغاء الطلب

function cancelRide() {

 if (!ride || ride.status !== "waiting") return;

 if (!confirm("هل تريد إلغاء الطلب؟")) return;

 ride = null;

 saveRide();

 showPage("home");

}

// تشغيل التطبيق

renderVehicles();
setupDriverVehicles();

if (ride) {
 if (ride.status === "waiting") {
  renderWaiting();
  showPage("waiting");
 } else if (ride.status === "accepted") {
  renderTrip();
  showPage("trip");
 }
}

</script>

</body>
</html>
